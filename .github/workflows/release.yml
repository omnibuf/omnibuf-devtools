name: Release Extension Archives

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Archives & Publish GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install dependencies
        run: just install

      - name: Run CI checks
        run: just ci

      - name: Package Chrome, Firefox, and AMO source archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_VERSION="$TAG" just pack
          else
            just pack
          fi
          (cd artifacts && sha256sum omnibuf-devtools-*.zip > checksums.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/omnibuf-devtools-*.zip artifacts/checksums.txt --clobber
          else
            gh release create "$TAG" artifacts/omnibuf-devtools-*.zip artifacts/checksums.txt --title "$TAG" --generate-notes
          fi
