<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniBuf DevTools</title>
    <link rel="icon" type="image/png" href="./icons/icon-32.png" />
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div id="app" class="workstation" data-mobile-screen="list" data-hex-open="false">
      <header class="topbar" role="banner">
        <div class="topbar-main">
          <div class="brand-cluster">
            <svg class="brand-mark" viewBox="0 0 64 64" width="18" height="18" aria-hidden="true">
              <rect x="8" y="8" width="52" height="52" rx="10" fill="#FF4F18" />
              <rect
                x="4"
                y="4"
                width="52"
                height="52"
                rx="10"
                fill="#111111"
                stroke="#111111"
                stroke-width="3"
              />
              <rect x="13" y="13" width="34" height="34" rx="6" stroke="#FAF8F2" stroke-width="5" />
              <rect x="22" y="22" width="16" height="16" rx="2" fill="#D4FF33" />
            </svg>
            <span class="brand-title">OmniBuf</span>
            <span id="demo-badge" class="demo-pill" hidden>Demo</span>
          </div>

          <div class="topbar-actions">
            <input
              type="file"
              id="obuf-file-input"
              accept=".obuf,.gz,application/octet-stream,*/*"
              multiple
              hidden
            />
            <button
              type="button"
              id="btn-open-obuf"
              class="btn-quiet"
              title="Open local .obuf file"
            >
              Open
            </button>
            <button type="button" id="btn-clear" class="btn-quiet" title="Clear captured requests">
              Clear
            </button>
            <button
              type="button"
              id="btn-theme"
              class="btn-icon"
              title="Switch theme"
              aria-label="Switch theme"
            ></button>
          </div>
        </div>

        <div class="topbar-controls">
          <div class="seg-group" role="group" aria-label="Traffic scope">
            <button type="button" id="scope-omnibuf" class="seg-btn is-active" aria-pressed="true">
              OmniBuf <span id="count-omnibuf" class="seg-count">0</span>
            </button>
            <button type="button" id="scope-all" class="seg-btn" aria-pressed="false">
              All <span id="count-all" class="seg-count">0</span>
            </button>
          </div>

          <label class="search-box" aria-label="Filter requests">
            <input
              type="search"
              id="request-filter"
              placeholder="Filter..."
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>
      </header>

      <div id="workspace" class="workspace-grid">
        <aside class="pane pane-traffic" aria-label="Captured requests">
          <div id="request-list" class="request-list" role="listbox" aria-label="Requests"></div>
        </aside>

        <main class="pane pane-main" aria-label="Decoded response">
          <div id="inspector-bar" class="inspector-bar" hidden>
            <div class="inspector-bar-left">
              <button
                type="button"
                id="btn-mobile-back"
                class="btn-quiet btn-mobile-back"
                aria-label="Back to requests"
              ></button>

              <div class="view-tabs" role="tablist" aria-label="Response view">
                <button
                  type="button"
                  id="vtab-tree"
                  class="view-tab is-active"
                  role="tab"
                  aria-selected="true"
                >
                  Tree
                </button>
                <button
                  type="button"
                  id="vtab-json"
                  class="view-tab"
                  role="tab"
                  aria-selected="false"
                >
                  JSON
                </button>
                <button
                  type="button"
                  id="vtab-headers"
                  class="view-tab"
                  role="tab"
                  aria-selected="false"
                >
                  Headers
                </button>
              </div>

              <span id="schema-type-hint" class="schema-type-hint" hidden></span>
            </div>

            <div class="inspector-bar-right">
              <label
                id="field-filter-wrap"
                class="search-box search-box-compact"
                aria-label="Filter fields"
              >
                <input
                  type="search"
                  id="field-filter"
                  placeholder="Filter fields"
                  autocomplete="off"
                  spellcheck="false"
                />
              </label>

              <button type="button" id="btn-copy-json" class="btn-quiet" title="Copy JSON">
                Copy
              </button>
              <button
                type="button"
                id="btn-toggle-hex"
                class="btn-quiet"
                aria-pressed="false"
                title="Toggle hex inspector"
              >
                Hex
              </button>

              <details id="more-menu" class="more-menu">
                <summary
                  id="more-menu-trigger"
                  class="btn-icon"
                  aria-label="More options"
                  title="More options"
                ></summary>
                <div class="more-popover">
                  <label class="menu-field">
                    <span>Protocol</span>
                    <select id="protocol-select" class="select-tool">
                      <option value="auto">Auto</option>
                      <option value="raw">Plain HTTP / .obuf</option>
                      <option value="connect-unary">Connect Unary</option>
                      <option value="connect-streaming">Connect Streaming</option>
                      <option value="grpc-web">gRPC-Web</option>
                      <option value="grpc-web-text">gRPC-Web Text</option>
                    </select>
                  </label>

                  <label class="menu-check">
                    <input type="checkbox" id="toggle-field0" />
                    <span>Show Field #0 schema</span>
                  </label>

                  <label class="menu-check">
                    <input type="checkbox" id="preserve-log" />
                    <span>Preserve log on reload</span>
                  </label>

                  <div class="menu-sep"></div>

                  <button type="button" id="btn-expand-all" class="menu-item">Expand all</button>
                  <button type="button" id="btn-collapse-all" class="menu-item">
                    Collapse all
                  </button>

                  <div class="menu-sep"></div>

                  <button type="button" id="btn-export-json" class="menu-item">Save .json</button>
                  <button type="button" id="btn-save-obuf" class="menu-item">Save .obuf</button>
                </div>
              </details>
            </div>
          </div>

          <div id="warning-banner" class="warning-banner" hidden></div>
          <div
            id="envelope-strip"
            class="envelope-strip"
            role="tablist"
            aria-label="Stream frames"
            hidden
          ></div>
          <div id="main-viewport" class="main-viewport"></div>
        </main>

        <aside id="pane-hex" class="pane pane-hex" aria-label="Hex inspector" hidden>
          <div class="hex-bar">
            <span class="hex-bar-title">Hex</span>
            <span id="hex-bar-meta" class="hex-bar-meta"></span>
            <button
              type="button"
              id="btn-close-hex"
              class="btn-icon"
              aria-label="Close hex panel"
              title="Close hex panel"
            ></button>
          </div>
          <div id="panel-hex" class="hex-body"></div>
        </aside>
      </div>

      <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-card">
          <span class="drop-title">Drop .obuf file</span>
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="./panel.js"></script>
  </body>
</html>
